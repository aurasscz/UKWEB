<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lekce · Studovna</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23233a6b'/%3E%3Cpath d='M8 9h7a3 3 0 0 1 3 3v12a2.5 2.5 0 0 0-2.5-2.5H8zM24 9h-4.5' fill='none' stroke='%23f4ead2' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=Source+Sans+3:wght@500;600&display=swap">
<style>
/* Tenká lišta nahoře (zpět na Studovnu) a pod ní lekce v plné výšce. */
:root {
  --bg: #F5F1E8; --surface: #FFFDF8; --ink: #1D2433; --muted: #5E6575; --line: #E2DCCD; --accent: #233A6B;
  --display: "Fraunces", Georgia, serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #12151C; --surface: #1A1E28; --ink: #ECE8DF; --muted: #A0A6B4; --line: #2A303D; --accent: #A9BCF0; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #12151C; --surface: #1A1E28; --ink: #ECE8DF; --muted: #A0A6B4; --line: #2A303D; --accent: #A9BCF0; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 500 1rem/1.3 var(--body); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.bar { flex: none; display: flex; align-items: center; gap: 12px; padding: max(8px, env(safe-area-inset-top)) 16px 8px; background: var(--surface); border-bottom: 1px solid var(--line); min-height: 52px; }
.back, .full { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 8px; color: var(--accent); text-decoration: none; font-weight: 600; white-space: nowrap; }
.back { margin-left: -10px; }
.back:hover, .full:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.title { flex: 1; min-width: 0; margin: 0; font: 650 1.08rem/1.2 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.full { color: var(--muted); font-size: 0.92rem; }
@media (max-width: 520px) { .back span, .full span { display: none; } .title { font-size: 1rem; } }

iframe { flex: 1; width: 100%; border: 0; display: block; background: var(--bg); }
.msg { margin: 48px auto; padding: 0 16px; max-width: 32rem; text-align: center; color: var(--muted); }
.msg a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<nav class="bar">
  <a class="back" href="./">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    <span>Studovna</span>
  </a>
  <h1 class="title" id="title"></h1>
  <a class="full" id="full" href="./" hidden title="Otevřít lekci samostatně">
    <span>Celá obrazovka</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M10 4H4v16h16v-6"/></svg>
  </a>
</nav>
<div id="out"></div>

<script>
const slug = new URLSearchParams(location.search).get('l');
const out = document.getElementById('out');

function fail(text) {
  out.outerHTML = '<p class="msg">' + text + ' <a href="./">Zpět na Studovnu</a></p>';
}

fetch('lekce.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    const x = (d.lekce || []).find(l => l.slug === slug);
    if (!x) { fail('Tahle lekce tu není.'); return; }
    document.title = x.title + ' · Studovna';
    document.getElementById('title').textContent = x.title;
    const full = document.getElementById('full');
    full.href = x.href;
    full.hidden = false;
    const f = document.createElement('iframe');
    f.src = x.href;
    f.title = x.title;
    out.replaceWith(f);
    f.focus();
  })
  .catch(() => fail('Lekci se nepodařilo načíst.'));
</script>
</body>
</html>
