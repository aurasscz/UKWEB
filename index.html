<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dějiny umění</title>
<meta name="description" content="Výpisky a procvičovačky na jednom místě.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23233a6b'/%3E%3Cpath d='M8 9h7a3 3 0 0 1 3 3v12a2.5 2.5 0 0 0-2.5-2.5H8zM24 9h-4.5' fill='none' stroke='%23f4ead2' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #F5F1E8;
  --surface: #FFFDF8;
  --ink: #1D2433;
  --muted: #5E6575;
  --line: #E2DCCD;
  --line-strong: #C9C0AC;
  --accent: #233A6B;
  --accent-soft: #E3E8F3;
  --gold: #8C6A1C;
  --gold-soft: #F4EAD2;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151C; --surface: #1A1E28; --ink: #ECE8DF; --muted: #A0A6B4;
    --line: #2A303D; --line-strong: #444C5D; --accent: #A9BCF0; --accent-soft: #232C42;
    --gold: #DDB766; --gold-soft: #352D1C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151C; --surface: #1A1E28; --ink: #ECE8DF; --muted: #A0A6B4;
  --line: #2A303D; --line-strong: #444C5D; --accent: #A9BCF0; --accent-soft: #232C42;
  --gold: #DDB766; --gold-soft: #352D1C; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1.0625rem/1.5 var(--body); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

.wrap { max-width: 50rem; margin-inline: auto; padding: max(36px, env(safe-area-inset-top)) 16px 72px; }

header { display: grid; gap: 10px; margin-bottom: 28px; }
.kicker { margin: 0; font: 600 0.78rem/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
h1 { margin: 0; font: 700 clamp(2.4rem, 8vw, 3.6rem)/1 var(--display); letter-spacing: -0.025em; color: var(--accent); }
.lede { margin: 0; max-width: 46ch; color: var(--muted); font-size: 1.1rem; }

.tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 8px; }
.search { position: relative; flex: 1 1 16rem; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; padding: 11px 14px 11px 40px; border: 1.5px solid var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--ink); font: 500 1rem var(--body); }
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--accent); }
.count { margin: 0; color: var(--muted); font-size: 0.95rem; font-variant-numeric: tabular-nums; }

.month { margin: 30px 0 10px; display: flex; align-items: baseline; gap: 12px; font: 600 0.8rem/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.month::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.card { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; }
.card:hover { border-color: var(--line-strong); }
.card:hover .go { color: var(--accent); transform: translateX(3px); }
@media (prefers-reduced-motion: no-preference) { .go { transition: transform 0.15s, color 0.15s; } }

.date { display: grid; justify-items: center; align-content: center; gap: 2px; height: 3.4rem; border-radius: 9px; background: var(--accent-soft); color: var(--accent); }
.date b { font: 700 1.35rem/1 var(--display); font-variant-numeric: tabular-nums; }
.date span { font: 600 0.68rem/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; }

.body { min-width: 0; display: grid; gap: 3px; }
.title { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font: 650 1.3rem/1.2 var(--display); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.new { padding: 3px 8px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); font: 700 0.68rem/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; }
.desc { margin: 0; color: var(--muted); font-size: 0.98rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.go { color: var(--muted); }
.meta-date { display: none; margin: 0; font: 600 0.75rem/1.2 var(--body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); }

@media (max-width: 520px) {
  .card { grid-template-columns: minmax(0, 1fr) auto; padding: 14px 14px 14px 16px; gap: 12px; }
  .date { display: none; }
  .title { font-size: 1.18rem; }
  .meta-date { display: block; }
}

.empty { margin: 28px 0; padding: 22px; border: 1.5px dashed var(--line-strong); border-radius: 12px; color: var(--muted); text-align: center; }

code { font: 0.92em ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">Archiv učiva</p>
    <h1>Dějiny umění</h1>
    <p class="lede">Všechny výpisky a procvičovačky na jednom místě. Nejnovější jsou nahoře.</p>
  </header>

  <div class="tools">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Hledat lekci…" autocomplete="off" aria-label="Hledat lekci">
    </label>
    <p class="count" id="count" aria-live="polite"></p>
  </div>

  <main id="out"></main>

</div>

<script>
const MONTHS = ['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
const MON = ['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];
const NEW_DAYS = 7;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

let all = [];

function parseDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return { y, m, d, t: new Date(y, m - 1, d).getTime() };
}

function card(x) {
  const dt = parseDate(x.date);
  const isNew = (Date.now() - dt.t) / 864e5 < NEW_DAYS;
  return '<li><a class="card" href="lekce.html?l=' + encodeURIComponent(x.slug) + '">' +
    '<div class="date" aria-hidden="true"><b>' + dt.d + '</b><span>' + MON[dt.m - 1] + '</span></div>' +
    '<div class="body">' +
      '<p class="meta-date">' + dt.d + '. ' + (dt.m) + '. ' + dt.y + '</p>' +
      '<h2 class="title">' + esc(x.title) + (isNew ? '<span class="new">Nové</span>' : '') + '</h2>' +
      (x.description ? '<p class="desc">' + esc(x.description) + '</p>' : '') +
    '</div>' +
    '<svg class="go" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>' +
  '</a></li>';
}

function render() {
  const q = norm($('#q').value.trim());
  const list = q ? all.filter(x => norm(x.title + ' ' + x.description).includes(q)) : all;
  $('#count').textContent = q ? list.length + ' z ' + all.length : all.length + ' ' + (all.length >= 1 && all.length < 5 ? 'lekce' : 'lekcí');

  if (!all.length) { $('#out').innerHTML = '<p class="empty">Zatím tu nic není. Nahraj první lekci do složky <code>lekce</code>.</p>'; return; }
  if (!list.length) { $('#out').innerHTML = '<p class="empty">Nic neodpovídá hledání „' + esc($('#q').value) + '“.</p>'; return; }

  let html = '', key = '';
  list.forEach(x => {
    const dt = parseDate(x.date);
    const k = dt.y + '-' + dt.m;
    if (k !== key) {
      if (key) html += '</ul>';
      html += '<h3 class="month">' + MONTHS[dt.m - 1] + ' ' + dt.y + '</h3><ul class="list">';
      key = k;
    }
    html += card(x);
  });
  $('#out').innerHTML = html + '</ul>';
}

$('#q').addEventListener('input', render);

fetch('lekce.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { all = d.lekce || []; render(); })
  .catch(() => { $('#out').innerHTML = '<p class="empty">Seznam lekcí se nepodařilo načíst. Zkus stránku obnovit.</p>'; });
</script>
</body>
</html>
